version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tn_edu_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: tn_edu_db
    ports:
      - "5432:5432"
    volumes:
      - tn_edu_postgres_data:/var/lib/postgresql/data

volumes:
  tn_edu_postgres_data:
    driver: local
